<svg xmlns="http://www.w3.org/2000/svg" width="850" height="190" viewBox="0 0 850 190" role="img" aria-label="5,374 contributions in the last year">
  <style>
    .title { font: 600 16px 'Segoe UI', Ubuntu, sans-serif; fill: #58A6FF; }
    .value { font: 700 34px 'Segoe UI', Ubuntu, sans-serif; fill: #FFFFFF; }
    .label { font: 600 14px 'Segoe UI', Ubuntu, sans-serif; fill: #58A6FF; }
    .sub { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8B949E; }
    .foot { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #6E7681; }
    .fade { opacity: 0; animation: in .6s ease forwards; }
    @keyframes in { to { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#0B3D91"/><stop offset=".6" stop-color="#1F6FEB"/><stop offset="1" stop-color="#00B4FF"/>
    </linearGradient>
  </defs>
  <rect width="850" height="190" rx="10" fill="#0D1117"/>
  <rect width="850" height="4" rx="2" fill="url(#bar)"/>
  <text x="24" y="36" class="title">GitHub activity (includes private work)</text>
  
  <g transform="translate(106,0)" class="fade" style="animation-delay:0.00s">
    <text y="92" text-anchor="middle" class="value">5,374</text>
    <text y="124" text-anchor="middle" class="label">Contributions</text>
    <text y="146" text-anchor="middle" class="sub">last 12 months</text>
  </g>
  <g transform="translate(319,0)" class="fade" style="animation-delay:0.15s">
    <text y="92" text-anchor="middle" class="value">371</text>
    <text y="124" text-anchor="middle" class="label">Best day</text>
    <text y="146" text-anchor="middle" class="sub">contributions in one day</text>
  </g><line x1="212" y1="58" x2="212" y2="150" stroke="#21262D"/>
  <g transform="translate(531,0)" class="fade" style="animation-delay:0.30s">
    <text y="92" text-anchor="middle" class="value">1 days</text>
    <text y="124" text-anchor="middle" class="label">Current streak</text>
    <text y="146" text-anchor="middle" class="sub"></text>
  </g><line x1="425" y1="58" x2="425" y2="150" stroke="#21262D"/>
  <g transform="translate(744,0)" class="fade" style="animation-delay:0.45s">
    <text y="92" text-anchor="middle" class="value">92 days</text>
    <text y="124" text-anchor="middle" class="label">Longest streak</text>
    <text y="146" text-anchor="middle" class="sub">last 12 months</text>
  </g><line x1="638" y1="58" x2="638" y2="150" stroke="#21262D"/>
  <text x="826" y="176" text-anchor="end" class="foot">Updated Oct 16, 2026 · best day: 371</text>
